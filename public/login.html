<!doctype html>
<html lang="it" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Accedi · Kanban Board</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232f6fed'/%3E%3Crect x='18' y='20' width='16' height='60' fill='white'/%3E%3Crect x='42' y='20' width='16' height='40' fill='white'/%3E%3Crect x='66' y='20' width='16' height='50' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('kanban.prefs') || '{}');
        var t = p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <main class="auth-page">
      <div class="auth-card">
        <h1 class="auth-card__title">Kanban Board</h1>

        <div class="tabs" role="tablist">
          <button
            id="tab-login"
            class="tab tab--active"
            type="button"
            role="tab"
            aria-selected="true"
            aria-controls="login-form"
          >
            Accedi
          </button>
          <button
            id="tab-register"
            class="tab"
            type="button"
            role="tab"
            aria-selected="false"
            aria-controls="register-form"
            tabindex="-1"
          >
            Registrati
          </button>
        </div>

        <form id="login-form" role="tabpanel" aria-labelledby="tab-login" novalidate>
          <div id="login-alert" class="form-alert" role="alert" hidden></div>
          <div class="form-field">
            <label class="form-label" for="login-username">Username</label>
            <input
              id="login-username"
              class="input"
              name="username"
              autocomplete="username"
              required
              aria-describedby="login-username-error"
            />
            <p id="login-username-error" class="form-error"></p>
          </div>
          <div class="form-field">
            <label class="form-label" for="login-password">Password</label>
            <input
              id="login-password"
              class="input"
              name="password"
              type="password"
              autocomplete="current-password"
              required
              aria-describedby="login-password-error"
            />
            <p id="login-password-error" class="form-error"></p>
          </div>
          <button class="btn btn--primary btn--block" type="submit" disabled>Accedi</button>
        </form>

        <form id="register-form" role="tabpanel" aria-labelledby="tab-register" novalidate hidden>
          <div id="register-alert" class="form-alert" role="alert" hidden></div>
          <div class="form-field">
            <label class="form-label" for="register-username">Username</label>
            <input
              id="register-username"
              class="input"
              name="username"
              autocomplete="username"
              required
              aria-describedby="register-username-error"
            />
            <p id="register-username-error" class="form-error"></p>
          </div>
          <div class="form-field">
            <label class="form-label" for="register-password">Password</label>
            <input
              id="register-password"
              class="input"
              name="password"
              type="password"
              autocomplete="new-password"
              required
              aria-describedby="register-password-hint register-password-error"
            />
            <p id="register-password-hint" class="form-hint">Almeno 8 caratteri</p>
            <p id="register-password-error" class="form-error"></p>
          </div>
          <div class="form-field">
            <label class="form-label" for="register-password-confirm">Conferma password</label>
            <input
              id="register-password-confirm"
              class="input"
              name="passwordConfirm"
              type="password"
              autocomplete="new-password"
              required
              aria-describedby="register-password-confirm-error"
            />
            <p id="register-password-confirm-error" class="form-error"></p>
          </div>
          <button class="btn btn--primary btn--block" type="submit" disabled>Crea account</button>
        </form>
      </div>
    </main>
    <script type="module" src="js/auth-ui.js"></script>
  </body>
</html>
