<!doctype html>
<html lang="it" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Kanban Board</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='14' fill='%2317201e'/%3E%3Crect x='16' y='22' width='20' height='14' rx='2' fill='%23f5b700'/%3E%3Crect x='40' y='22' width='20' height='14' rx='2' fill='%23ecede8'/%3E%3Crect x='40' y='42' width='20' height='14' rx='2' fill='%23ecede8'/%3E%3Crect x='64' y='22' width='20' height='14' rx='2' fill='%23ecede8'/%3E%3Crect x='64' y='42' width='20' height='14' rx='2' fill='%23ecede8'/%3E%3Crect x='64' y='62' width='20' height='14' rx='2' fill='%23ecede8'/%3E%3C/svg%3E"
    />
    <script src="js/theme-init.js"></script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
    <link rel="stylesheet" href="css/features.css" />
  </head>
  <body>
    <a class="skip-link" href="#board">Vai alla board</a>

    <div class="shell">
      <aside id="sidebar" class="sidebar" aria-label="Navigazione">
        <div class="sidebar__brand">
          <span class="sidebar__mark" aria-hidden="true"></span>
          <span class="sidebar__name">Kanban</span>
          <button
            id="nav-close"
            class="sidebar__close btn btn--icon"
            type="button"
            aria-label="Chiudi menu"
          >
            <span data-icon="x"></span>
          </button>
        </div>

        <section class="sidebar__section" aria-labelledby="boards-heading">
          <h2 id="boards-heading" class="sidebar__heading">Board</h2>
          <label class="visually-hidden" for="board-select">Board attiva</label>
          <select id="board-select" class="select sidebar__select"></select>
          <div class="sidebar__row">
            <button id="board-new" class="nav-item" type="button">
              <span class="nav-item__icon" data-icon="plus"></span>
              <span class="nav-item__label">Nuova board</span>
            </button>
            <button id="board-settings" class="nav-item" type="button">
              <span class="nav-item__icon" data-icon="settings"></span>
              <span class="nav-item__label">Impostazioni</span>
            </button>
          </div>
        </section>

        <nav class="sidebar__section" aria-labelledby="views-heading">
          <h2 id="views-heading" class="sidebar__heading">Viste</h2>
          <button class="nav-item tab--active" type="button" data-view="board" aria-current="page">
            <span class="nav-item__icon" data-icon="board"></span>
            <span class="nav-item__label">Board</span>
          </button>
          <button class="nav-item" type="button" data-view="calendar" aria-current="false">
            <span class="nav-item__icon" data-icon="calendar"></span>
            <span class="nav-item__label">Calendario</span>
          </button>
          <button class="nav-item" type="button" data-view="dashboard" aria-current="false">
            <span class="nav-item__icon" data-icon="chart"></span>
            <span class="nav-item__label">Dashboard</span>
          </button>
          <button class="nav-item" type="button" data-view="activity" aria-current="false">
            <span class="nav-item__icon" data-icon="history"></span>
            <span class="nav-item__label">Attività recenti</span>
          </button>
        </nav>

        <div class="sidebar__footer">
          <div class="notif-wrap">
            <button id="notif-button" class="nav-item" type="button" aria-label="Notifiche">
              <span class="nav-item__icon" data-icon="bell"></span>
              <span class="nav-item__label">Notifiche</span>
              <span id="notif-badge" class="notif-badge" hidden>0</span>
            </button>
            <div id="notif-panel" class="notif-panel" hidden></div>
          </div>
          <button id="a11y-button" class="nav-item" type="button">
            <span class="nav-item__icon" data-icon="accessibility"></span>
            <span class="nav-item__label">Accessibilità</span>
          </button>
          <button id="theme-toggle" class="nav-item" type="button" aria-label="Attiva tema scuro">
            Tema scuro
          </button>
          <div class="sidebar__account">
            <button id="profile-button" class="profile-button" type="button"></button>
            <button id="logout-button" class="btn btn--quiet" type="button">Esci</button>
          </div>
        </div>
      </aside>
      <div class="sidebar-scrim" data-nav-close hidden></div>

      <div class="workspace">
        <div id="status-banner" class="status-banner" role="status" hidden></div>

        <div id="toolbar" class="toolbar" data-view="board">
          <button
            id="nav-open"
            class="toolbar__menu btn btn--icon"
            type="button"
            aria-label="Apri menu"
            aria-controls="sidebar"
            aria-expanded="false"
          >
            <span data-icon="menu"></span>
          </button>
          <h1 id="board-title" class="toolbar__title">Kanban</h1>
          <div class="toolbar__search">
            <label class="visually-hidden" for="search-input">Cerca attività</label>
            <input
              id="search-input"
              class="input"
              type="search"
              placeholder="Cerca per titolo, testo o etichetta"
              autocomplete="off"
            />
          </div>
          <button id="new-task-button" class="btn btn--primary toolbar__new" type="button">
            <span data-icon="plus"></span> <span class="toolbar__new-label">Nuova attività</span>
          </button>
          <div class="toolbar__filters">
            <div id="filters" class="filters"></div>
            <div class="toolbar__switches">
              <button
                id="compact-toggle"
                class="btn btn--secondary toolbar__compact"
                type="button"
                aria-pressed="false"
              >
                Compatta
              </button>
              <label class="filter-check toolbar__archive">
                <input id="archive-toggle" type="checkbox" />
                <span>Archivio</span>
              </label>
            </div>
          </div>
        </div>

        <main id="board" class="board" aria-label="Board Kanban"></main>
        <section id="view" class="view" aria-live="polite" hidden></section>
      </div>
    </div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
