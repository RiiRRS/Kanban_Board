<!doctype html>
<html lang="it" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Kanban Board</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%232f6fed'/%3E%3Crect x='18' y='20' width='16' height='60' fill='white'/%3E%3Crect x='42' y='20' width='16' height='40' fill='white'/%3E%3Crect x='66' y='20' width='16' height='50' fill='white'/%3E%3C/svg%3E"
    />
    <script>
      try {
        var p = JSON.parse(localStorage.getItem('kanban.prefs') || '{}');
        var t = p.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />
  </head>
  <body>
    <a class="skip-link" href="#board">Vai alla board</a>
    <header id="app-header" class="app-header">
      <h1 class="app-header__logo">Kanban</h1>
      <div class="app-header__search">
        <label class="visually-hidden" for="search-input">Cerca attività</label>
        <input id="search-input" class="input" type="search" placeholder="Cerca..." autocomplete="off" />
      </div>
      <div id="filters" class="app-header__filters"></div>
      <div class="app-header__actions">
        <button id="new-task-button" class="btn btn--primary" type="button">
          <span aria-hidden="true">+</span> <span class="app-header__label">Nuova attività</span>
        </button>
        <button id="theme-toggle" class="btn btn--ghost" type="button" aria-label="Attiva tema scuro">Tema scuro</button>
        <span class="app-header__user">Utente: <span id="current-user"></span></span>
        <button id="logout-button" class="btn btn--secondary" type="button">Esci</button>
      </div>
    </header>
    <div id="status-banner" class="status-banner" role="status" hidden></div>
    <main id="board" class="board" aria-label="Board Kanban"></main>
    <script type="module" src="js/app.js"></script>
  </body>
</html>
